# Production-style Elrond configuration.
#
# Replace the example paths and hostnames with your own. This file
# demonstrates every operationally important directive Elrond v0.27.0
# supports — copy and trim to your needs.

# === Process / logging =====================================================

worker_processes auto;                 # accepted; v0.x runs single-process
pid               /run/elrond.pid;     # systemd & logrotate reference this
error_log         /var/log/elrond/error.log;

events {}                              # accepted for compatibility

http {
    access_log /var/log/elrond/access.log;

    # === Limits ============================================================
    client_max_body_size 10m;          # reject oversize uploads at the door

    # === Brute-force protection ===========================================
    limit_req_zone  $remote_addr zone=login_burst:10m rate=5r/s;
    limit_conn_zone $remote_addr zone=per_ip:10m;

    # === Variable plumbing ================================================
    map $request_method $is_write {
        "GET"     "0";
        "HEAD"    "0";
        "OPTIONS" "0";
        default   "1";
    }

    # === Cache ============================================================
    proxy_cache_path /var/cache/elrond keys_zone=public_assets:100m max_size=1g;

    # === Upstreams ========================================================
    upstream app_backend {
        least_conn;
        server 10.0.0.10:3000 max_fails=3 fail_timeout=15s;
        server 10.0.0.11:3000 max_fails=3 fail_timeout=15s;
        server 10.0.0.12:3000 backup;
        health_check uri=/healthz interval=5s timeout=2s match=200;
        keepalive 32;
    }

    # === Redirect plain HTTP → HTTPS ======================================
    server {
        listen 80;
        server_name www.example.com api.example.com admin.example.com;
        location / {
            return 301 "https://$host$request_uri";
        }
    }

    # === Public website (TLS multi-cert vhost #1) =========================
    server {
        listen 443 ssl;
        server_name www.example.com;
        ssl_certificate     /etc/elrond/certs/www.example.com.crt;
        ssl_certificate_key /etc/elrond/certs/www.example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root  /var/www/www.example.com;
        gzip  on;
        gzip_types application/json application/javascript text/css text/html image/svg+xml;
        # Security baseline headers (apply to every location).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "DENY";
        add_header X-Content-Type-Options    "nosniff";
        add_header Referrer-Policy           "strict-origin-when-cross-origin";

        # Cached static assets.
        location /static/ {
            expires 30d;
            limit_conn per_ip 100;
            try_files $uri =404;
        }

        # SPA shell.
        location / {
            limit_conn per_ip 100;
            try_files $uri /index.html;
        }
    }

    # === API (TLS multi-cert vhost #2, proxied + cached) ==================
    server {
        listen 443 ssl;
        server_name api.example.com;
        ssl_certificate     /etc/elrond/certs/api.example.com.crt;
        ssl_certificate_key /etc/elrond/certs/api.example.com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        gzip on;

        location = /login {
            limit_conn per_ip 50;
            limit_req           zone=login_burst burst=5;
            proxy_pass          http://app_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout    10s;
        }

        location /v1/cacheable/ {
            proxy_pass          http://app_backend;
            proxy_cache         public_assets;
            proxy_cache_valid   200 60s;
            proxy_cache_valid   404  5s;
            proxy_cache_key     "$scheme$host$request_uri";
            proxy_read_timeout  10s;
        }

        location / {
            proxy_pass          http://app_backend;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Original-URI    $request_uri;
            proxy_read_timeout  60s;
        }
    }

    # === Admin area (auth_basic + IP allow-list) ==========================
    server {
        listen 443 ssl;
        server_name admin.example.com;
        ssl_certificate     /etc/elrond/certs/admin.example.com.crt;
        ssl_certificate_key /etc/elrond/certs/admin.example.com.key;
        ssl_protocols       TLSv1.3;     # admin is TLS-1.3 only

        location / {
            allow 10.0.0.0/8;            # office VPN
            allow 192.168.0.0/16;        # data-centre internal
            deny  all;

            auth_basic           "admin";
            auth_basic_user_file /etc/elrond/admin.htpasswd;

            proxy_pass http://app_backend;
        }
    }

    # === Internal metrics endpoint ========================================
    server {
        listen 127.0.0.1:9100;           # bind to loopback only
        location = /metrics {
            allow 127.0.0.0/8;
            allow ::1;
            deny  all;
            metrics;
        }
    }
}

# === Database TCP proxy (separate from HTTP) ==============================
stream {
    upstream postgres {
        server 10.0.0.50:5432;
        server 10.0.0.51:5432 backup;
    }
    server {
        listen 15432;
        proxy_pass postgres;
    }
}
