# Serve files from ./public
#   elrond -c examples/static.conf
#   curl http://localhost:8080/static/index.html

http {
    server {
        listen 8080;
        server_name localhost;

        location /static/ {
            root ./public;
        }

        location / {
            return 404 "not found\n";
        }
    }
}
