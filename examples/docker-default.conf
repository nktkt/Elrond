## Default config baked into the Elrond container image.
##
## Drops to the in-image `elrond` user, serves a placeholder response.
## Operators override by mounting their own config:
##   docker run -p 80:80 -v ./elrond.conf:/etc/elrond/elrond.conf elrond

user elrond elrond;
worker_rlimit_nofile 65536;

http {
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;

        location / {
            return 200 "elrond container is up. Mount your own /etc/elrond/elrond.conf.\n";
        }

        location /metrics {
            metrics;
        }
    }
}
