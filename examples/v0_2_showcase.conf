# Demonstrates the v0.2.0 additions:
#   - exact-match location
#   - server-level `root` cascade
#   - alias
#   - add_header with template variables
#   - proxy_set_header with variables
#   - include

http {
    upstream app {
        server 127.0.0.1:3000;
    }

    server {
        listen 8080;
        server_name elrond.local;
        root ./public;

        # Exact match wins over the catch-all below.
        location = /healthz {
            return 200 "ok\n";
            add_header X-Service "elrond";
        }

        # Server-level `root` cascades here (no explicit content directive).
        location /static/ { }

        # Alias rewrites the matched prefix.
        location /assets/ {
            alias ./public/static/;
        }

        # Variables in the response template.
        location = /whoami {
            return 200 "method=$request_method ua=$http_user_agent ip=$remote_addr\n";
            add_header X-Server "$server_name";
        }

        location / {
            proxy_pass http://app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
        }
    }
}
