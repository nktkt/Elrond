# Default Elrond configuration. Runs out of the box with no backends.
#   elrond            # uses this file
#   elrond -t         # check syntax only

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log logs/access.log;

    server {
        listen 8080;
        server_name localhost;

        location /static/ {
            root ./public;
        }

        location / {
            return 200 "hello from elrond\n";
        }
    }
}
